name: Floating inputs

# CI and releases smoke-test each binary with every input pinned, so they
# gate on this repository alone. A new user's project is not pinned: it takes
# Blueprint's default package source, the roc-overlay's default branch and its
# newest nightly. This runs the same smoke test in that floating form, weekly
# or on request, on the three released systems. A failure here means upstream
# moved; it blocks nothing.
on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain

      - name: Fetch and verify the platform's linker inputs
        run: nix develop -c scripts/link_inputs.roc fetch

      - name: Cross-build the release binaries and their smoke-test programs
        run: nix develop -c scripts/build_release.roc

      - name: Upload the binaries, platform hosts and linker inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueprint-binaries
          path: |
            dist/blueprint-*
            dist/smoke-*
            blueprint-platform/targets/*/*.a
            blueprint-platform/targets/*/crt1.o
            blueprint-platform/targets/*/*.lib
          if-no-files-found: error

  # These runners have Nix and no Roc, as a new user's machine may.
  smoke:
    permissions:
      contents: read
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-latest, system: aarch64-darwin }
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blueprint-binaries

      - name: Smoke test the binary with floating inputs
        run: |
          chmod +x dist/blueprint-${{ matrix.system }} dist/smoke-${{ matrix.system }}
          dist/smoke-${{ matrix.system }} --floating dist/blueprint-${{ matrix.system }}

  windows-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Compare native Windows compiler cache modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = 'nightly-2026-10-18-1df370f'
          $archive = 'roc_nightly-windows_x86_64-2026-10-18-1df370f.zip'
          Invoke-WebRequest "https://github.com/roc-lang/nightlies/releases/download/$tag/$archive" -OutFile roc.zip
          if ((Get-FileHash roc.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7acbefc4440c4d7977c47fefb2d8d683b289062c08b4733b9acfc071cb5511b5') { throw 'Compiler digest mismatch' }
          Expand-Archive roc.zip compiler
          $roc = (Get-ChildItem compiler -Filter roc.exe -Recurse | Select-Object -First 1).FullName
          & $roc version
          @'
          app [main!] { cli: platform "https://github.com/roc-lang/basic-cli/releases/download/0.26.0-rc2/Gj3zVDr3qrQa6aTh7Z1zgUfe9NeBE6R76T5ho3xrc8af.tar.zst" }
          import cli.Stdout
          main! = |_args| Stdout.line!("Windows cached-object reproduction")
          '@ | Set-Content -Encoding utf8 hello.roc
          $app = (Resolve-Path hello.roc).Path
          $variants = @(
            @{ name = 'default'; flags = @() },
            @{ name = 'no-cache'; flags = @('--no-cache') },
            @{ name = 'one-worker'; flags = @('--jobs=1') }
          )
          foreach ($variant in $variants) {
            $env:XDG_CACHE_HOME = Join-Path $env:RUNNER_TEMP $variant.name
            $flags = $variant.flags
            Write-Host "BEGIN $($variant.name)"
            & $roc @flags $app
            $cold = $LASTEXITCODE
            & $roc @flags $app
            $warm = $LASTEXITCODE
            Write-Host "RESULT $($variant.name) cold=$cold warm=$warm"
          }
          exit 0
