name: Independent SBOM conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Generate the canonical fixtures with this checkout's renderer
        run: nix develop -c scripts/test_sbom.roc fixtures .cache/sbom-conformance-generated
      - uses: ./.github/actions/sbom-conformance
        with:
          patterns: .cache/sbom-conformance-generated/*.spdx.json .cache/sbom-conformance-generated/*.spdx-2.3.json .cache/sbom-conformance-generated/*.cdx.json tests/sbom/fixtures/upstream/*.json
      - name: Retain the independent validator results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-conformance
          path: sbom-conformance.json
          if-no-files-found: ignore
