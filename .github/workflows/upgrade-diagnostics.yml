name: Upgrade diagnostics
on:
  push:
    branches: [diagnosis/blueprint-upgrade]
permissions: {}
jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: |
          mkdir -p dist
          nix develop -c roc build scripts/test_release.roc --target=x64win --output=dist/test-release-x86_64-windows.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-archive-helper
          path: dist/test-release-x86_64-windows.exe
  windows:
    needs: helper
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-archive-diagnostic
          run-id: '40613179592'
          github-token: ${{ github.token }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-archive-helper
          path: dist
      - name: Run native archive harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/compiler | Out-Null
          tar.exe -xf dist/roc-x86_64-windows.zip --strip-components=1 -C dist/compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ROC = Join-Path $pwd 'dist/compiler/roc.exe'
          ./dist/test-release-x86_64-windows.exe 0.0.1-dry-run dist/blueprint-x86_64-windows.exe
          exit $LASTEXITCODE
