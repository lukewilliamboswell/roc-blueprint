name: Upgrade diagnostics
on:
  push:
    branches: [diagnosis/blueprint-upgrade]
permissions: {}
jobs:
  integration:
    name: Diagnostics (${{ matrix.script }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script: [test]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: blueprint-binaries
          run-id: '40606371807'
          github-token: ${{ github.token }}
      - run: install -m 755 dist/blueprint-x86_64-linux blueprint
      - name: Diagnose integration suite
        env:
          BLUEPRINT_PREBUILT: "1"
        run: nix develop -c scripts/test.roc cli
