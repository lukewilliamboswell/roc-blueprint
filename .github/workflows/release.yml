name: Release roc-blueprint

# Push a tag like 0.1.0 to publish the roc-blueprint platform bundle and
# prebuilt `blueprint` CLIs for Linux and macOS on x86_64 and arm64. All are
# built on Linux; each is run on its own kind of machine before anything is
# published.
#
# The platform depends on a published roc-blueprint-core release, whose bundle
# URL is pinned in blueprint-platform/core-release (core has its own release
# cycle; see release-core.yml).
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: The CLI reports the version being released
        run: grep -qF "version = \"${GITHUB_REF_NAME}\"" blueprint-cli/main.roc

      - name: Test (including a localhost bundle smoke test)
        run: ./scripts/test.sh

      - name: Bundle against the pinned core release
        run: scripts/bundle.sh platform "$(cat blueprint-platform/core-release)"

      - name: Cross-build the CLI binaries
        run: scripts/build-release.sh

      - name: Smoke test the Linux binary
        run: scripts/smoke-binary.sh dist/blueprint-x86_64-linux

      - name: Write the release notes
        run: |
          read -r _ pf < <(grep '^roc-blueprint ' dist/bundles.txt)
          core_url="$(cat blueprint-platform/core-release)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > dist/notes.md <<NOTES
          Platform (use in \`Blueprint.roc\`):

          \`\`\`roc
          app [config] { pf: platform "${url}/${pf}" }
          \`\`\`

          The \`blueprint\` CLI is attached for Linux and macOS on x86_64 and arm64, with sha256 sums in \`blueprint.sha256\`. It needs Nix and Python 3, and fetches its own Roc compiler through Nix.

          Uses roc-blueprint-core \`${core_url}\`. Built with Roc \`${ROC_NIGHTLY_TAG}\`. The platform supports x64musl, arm64musl, arm64mac and x64mac.
          NOTES
          printf '%s\n' "$pf" > dist/platform-bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            blueprint-platform/targets/*/libhost.a
          if-no-files-found: error

  binaries:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-latest, system: aarch64-darwin }
          - { runner: macos-15-intel, system: x86_64-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Smoke test the binary
        run: |
          chmod +x dist/blueprint-${{ matrix.system }}
          scripts/smoke-binary.sh dist/blueprint-${{ matrix.system }}

  publish:
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: this job only uploads what the tested jobs produced.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pf="$(cat dist/platform-bundle)"
          (cd dist && sha256sum -c blueprint.sha256)
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "roc-blueprint $GITHUB_REF_NAME" --notes-file dist/notes.md \
            "dist/${pf}" dist/blueprint-x86_64-linux dist/blueprint-aarch64-linux dist/blueprint-aarch64-darwin dist/blueprint-x86_64-darwin dist/blueprint.sha256
