name: Release roc-blueprint

# Push a tag like 0.1.0 to publish the roc-blueprint platform bundle and
# prebuilt `blueprint` CLIs for x86_64 Linux, arm64 Linux and Apple Silicon macOS. All are
# built on Linux; each is run on its own kind of machine before anything is
# published.
#
# The platform depends on a published roc-blueprint-core release, whose bundle
# URL is pinned in blueprint-platform/core-release (core has its own release
# cycle; see release-core.yml).
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.notes.outputs.bundle }}
      title: ${{ steps.notes.outputs.title }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/toolchain

      - name: The CLI reports the version being released
        run: grep -qF "version = \"${GITHUB_REF_NAME}\"" blueprint-cli/main.roc

      - name: Fetch and verify the platform's linker inputs
        run: nix develop -c scripts/link_inputs.roc fetch

      # Built once: the tests below run the binary that is published.
      - name: Cross-build the CLI binaries and their smoke-test programs
        run: nix develop -c scripts/build_release.roc

      - name: Use the built binary
        run: install -m 755 dist/blueprint-x86_64-linux blueprint

      - name: Test (including a localhost bundle smoke test)
        run: nix develop -c scripts/test.roc
        env:
          BLUEPRINT_PREBUILT: 1

      - name: Bundle against the pinned core release
        run: nix develop -c scripts/bundle.roc platform "$(cat blueprint-platform/core-release)"

      # Outside the dev shell: the binary must work with no Roc on PATH.
      - name: Smoke test the Linux binary
        run: dist/smoke-x86_64-linux dist/blueprint-x86_64-linux

      - name: Write the release notes
        id: notes
        run: nix develop -c scripts/release_notes.roc dist/notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            blueprint-platform/targets/*/*.a
            blueprint-platform/targets/*/crt1.o
          if-no-files-found: error

  binaries:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-latest, system: aarch64-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      # No Roc here: the smoke test is a program the build job cross-built.
      - name: Smoke test the binary
        run: |
          chmod +x dist/blueprint-${{ matrix.system }} dist/smoke-${{ matrix.system }}
          dist/smoke-${{ matrix.system }} dist/blueprint-${{ matrix.system }}

  publish:
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: this job only uploads what the tested jobs produced.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: The binaries are the ones that were built
        working-directory: dist
        run: sha256sum -c blueprint.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ needs.build.outputs.bundle }}
          TITLE: ${{ needs.build.outputs.title }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --prerelease="$PRERELEASE" --title "$TITLE" --notes-file dist/notes.md
          "dist/$BUNDLE" dist/blueprint-x86_64-linux dist/blueprint-aarch64-linux
          dist/blueprint-aarch64-darwin dist/blueprint.sha256
