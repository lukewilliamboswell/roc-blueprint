name: Release

# Run by hand from main with a version to publish a release. A pull request
# runs the same build and tests as a dry run, under a version that is never
# published.
#
# One release holds the platform, core and standalone SBOM app bundles; the
# `blueprint` and `blueprint-sbom` binaries for x86_64 Linux, arm64 Linux,
# Apple Silicon macOS and x86_64 Windows with checksums; artifact-bound SPDX
# sidecars; the examples, documentation and manual. Everything is built once,
# tested as those exact files on each kind of machine, and only then
# published, in one step.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.5.0, or 0.5.0-rc1 for a release candidate"
        required: true
        type: string
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# Every script runs through `nix develop -c`: the flake's dev shell is the one
# definition of the toolchain (see .github/actions/toolchain).
jobs:
  # Refuses a release that cannot be made from this commit before anything is
  # built: off the default branch, a version that is malformed, already a tag
  # or a release, without notes, or not the one the CLI reports.
  validate:
    name: Validate the request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.request.outputs.version }}
      title: ${{ steps.request.outputs.title }}
      prerelease: ${{ steps.request.outputs.prerelease }}
      compiler-tag: ${{ steps.request.outputs.compiler-tag }}
    steps:
      - name: Require the default branch for publication
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF_TYPE" = branch && test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" || { echo "Releases must run from the default branch" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain

      - name: Check the version, its notes and that it is not yet published
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.1-dry-run' }}
        run: nix develop -c scripts/check_version.roc request "$VERSION"

  build:
    name: Build the release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain

      - name: Fetch and verify the platform's linker inputs
        run: nix develop -c scripts/link_inputs.roc fetch

      # Built once: the tests below run the binaries that are published.
      - name: Cross-build the CLI binaries and their smoke-test programs
        run: nix develop -c scripts/build_release.roc

      - name: Use the built binary
        run: install -m 755 dist/blueprint-x86_64-linux blueprint

      # A pull request already runs every group in ci.yml.
      - name: Test
        if: github.event_name == 'workflow_dispatch'
        run: nix develop -c scripts/test.roc
        env:
          BLUEPRINT_PREBUILT: 1

      # The platform bundle names the core bundle by the URL this release
      # gives it, and both are smoke-tested from localhost.
      - name: Bundle core and the platform for this version
        run: nix develop -c scripts/bundle.roc "$VERSION"

      - name: The version bumps as far as the public API changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop -c scripts/check_version.roc bump "$VERSION"

      # Outside the dev shell: the binary must work with no Roc on PATH.
      - name: Smoke test the Linux binary
        run: dist/smoke-x86_64-linux dist/blueprint-x86_64-linux

      - name: Archive the examples with this release's platform
        run: nix develop -c scripts/package_examples.roc "$VERSION"

      # The SBOM cases the test suite asserts, with their contract, for
      # consumers that test the standalone tool without a checkout.
      - name: Archive the SBOM fixture set with its case contract
        run: nix develop -c scripts/package_sbom_fixtures.roc "$VERSION"

      # The manual attached to a release names that release's bundle.
      - name: Write the part of the manual that names the release
        run: nix develop -c scripts/docs_snippet.roc "$VERSION"

      # Supply the shared native renderer and the compiler used for API docs.
      - id: roc
        name: Locate the compiler and native documentation renderer
        run: |
          echo "command=$(nix develop -c sh -c 'command -v roc')" >> "$GITHUB_OUTPUT"
          renderer=$(nix build .#roc-docs --no-link --print-out-paths)
          echo "renderer=$renderer/bin/roc-docs" >> "$GITHUB_OUTPUT"

      - id: docs
        name: Render the manual as a site and a PDF
        uses: lukewilliamboswell/roc-automation/actions/build-docs@dec2d52a5cb6cd251fd188ad1d797f400ee1bb6e # tools-0.1.0-rc.1
        with:
          backend: roc
          renderer-binary: ${{ steps.roc.outputs.renderer }}
          pdf-filename: roc-blueprint.pdf
          pdf-image-dpi: "300"
          docs-version: ${{ needs.validate.outputs.version }}
          api-entrypoint: blueprint-platform/main.roc
          roc-command: ${{ steps.roc.outputs.command }}

      - name: Archive the documentation
        env:
          SITE: ${{ steps.docs.outputs.site-directory }}
        run: nix develop -c scripts/package_docs.roc "$VERSION" "$SITE"

      - name: Render the release notes
        run: nix develop -c scripts/release_notes.roc "$VERSION" dist/notes.md

      # Generate in the read-only build job from final bytes: SPDX 3.0.1, and
      # SPDX 2.3 and CycloneDX 1.7 of the same inventory, with an evidence
      # manifest per subject listing them by digest and size. The separate
      # offline check holds each to its version, the declared inventory and
      # the manifest beside it; shared publication policy belongs to
      # roc-automation.
      - name: Describe the final binaries and source bundles with SPDX
        run: nix develop -c scripts/release_sbom.roc "$VERSION"

      - name: Independently check SBOM conformance, subjects and known inputs
        run: nix develop -c scripts/check_sbom.roc --release-root . --artifacts dist dist/*.spdx.json dist/*.spdx-2.3.json dist/*.cdx.json

      # Fails unless the binaries and blueprint.sha256 carry the names
      # roc-automation's setup-blueprint action downloads.
      - name: Gather the assets and check the names callers depend on
        env:
          MANUAL: ${{ steps.docs.outputs.pdf-path }}
        run: nix develop -c scripts/release_assets.roc "$VERSION" "$MANUAL"

      # The smoke test evaluates a Blueprint.roc against this checkout's
      # platform, so the test jobs take the built hosts and the verified
      # linker inputs from here too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: |
            dist/
            blueprint-platform/targets/*/*.a
            blueprint-platform/targets/*/crt1.o
            blueprint-platform/targets/*/*.lib
          if-no-files-found: error

  # Each binary runs where it must work, and the examples archive is tested
  # as a user will get it. These runners have Nix and no Roc of their own.
  test:
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, system: x86_64-linux, archive: true }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux, archive: true }
          - { runner: macos-latest, system: aarch64-darwin, archive: true }
          - { runner: windows-latest, system: x86_64-windows, archive: false }
    name: Test on ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        if: runner.os != 'Windows'
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate

      # No Roc here: the smoke test is a program the build job cross-built.
      - name: Smoke test the binary
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/blueprint-${{ matrix.system }} dist/smoke-${{ matrix.system }}
          dist/smoke-${{ matrix.system }} dist/blueprint-${{ matrix.system }}

      - name: Smoke test Windows without Nix
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dist/smoke-x86_64-windows.exe --no-nix ./dist/blueprint-x86_64-windows.exe

      # The SBOM tool binary of this system inspects, binds and checks the
      # committed fixtures with no Roc.
      - name: Smoke test the SBOM tool binary
        uses: ./.github/actions/sbom-tool
        with:
          binary: dist/blueprint-sbom-${{ matrix.system }}${{ runner.os == 'Windows' && '.exe' || '' }}

      # The compiler and then this binary load each archived example from the
      # two bundles, served from localhost with an empty package cache.
      - name: Test the examples archive against the bundles
        if: matrix.archive
        run: nix develop -c scripts/test_release.roc "$VERSION" dist/blueprint-${{ matrix.system }}

  # Holds the permission to publish, checks out nothing and runs no script of
  # the repository: it uploads what the jobs above built and tested.
  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate

      # setup-blueprint downloads these names from the release, as published;
      # the SBOM tool binaries follow the CLI's in the checksum file.
      - name: The binaries and their checksums carry the names callers depend on
        working-directory: dist/release
        run: |
          set -euo pipefail
          for name in blueprint-x86_64-linux blueprint-aarch64-linux blueprint-aarch64-darwin blueprint-x86_64-windows.exe blueprint-sbom-x86_64-linux blueprint-sbom-aarch64-linux blueprint-sbom-aarch64-darwin blueprint-sbom-x86_64-windows.exe blueprint.sha256; do
            test -f "$name"
          done
          test "$(find . -type f -name 'blueprint*' ! -name '*.spdx.json' ! -name '*.spdx-2.3.json' ! -name '*.cdx.json' ! -name '*.sbom-manifest.json' | wc -l)" = 9
          sha256sum -c blueprint.sha256
          test "$(LC_ALL=C ls)" = "$(cat ../release-assets.txt)"

      # These subjects are the exact assets built and tested in this run.
      # No repository code runs with the signing/publication permissions.
      - name: Attest the tested release assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/*
          create-storage-record: false

      - name: Retain and verify the provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" dist/release/roc-blueprint-provenance.sigstore.json
          for name in blueprint-x86_64-linux blueprint-aarch64-linux blueprint-aarch64-darwin blueprint-x86_64-windows.exe blueprint-sbom-x86_64-linux blueprint-sbom-aarch64-linux blueprint-sbom-aarch64-darwin blueprint-sbom-x86_64-windows.exe; do
            policy=(--repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners)
            gh attestation verify "dist/release/$name" "${policy[@]}" --bundle "$BUNDLE"
            gh attestation verify "dist/release/$name" "${policy[@]}"
          done

          # Exercise rejection too: a valid bundle cannot authorize other
          # bytes, another source revision, or a different workflow.
          must_reject() {
            if gh attestation verify "$@" --repo "$GH_REPO" --bundle "$BUNDLE" > /dev/null 2>&1; then
              echo "Provenance verification accepted an invalid artifact or identity" >&2
              exit 1
            fi
          }
          cp dist/release/blueprint-x86_64-linux dist/modified-binary
          printf 'modified' >> dist/modified-binary
          must_reject dist/modified-binary
          must_reject dist/release/blueprint-x86_64-linux --source-digest 0000000000000000000000000000000000000000
          must_reject dist/release/blueprint-x86_64-linux --signer-workflow "$GH_REPO/.github/workflows/ci.yml"

          printf '%s\n' roc-blueprint-provenance.sigstore.json >> dist/release-assets.txt
          LC_ALL=C sort -o dist/release-assets.txt dist/release-assets.txt
          test "$(LC_ALL=C ls dist/release)" = "$(cat dist/release-assets.txt)"

      # A published release is never completed or corrected afterwards. So
      # every asset goes onto a draft, is downloaded back and compared with
      # the tested file, and only then is the release published.
      - name: Publish the tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          TITLE: ${{ needs.validate.outputs.title }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          COMPILER_TAG: ${{ needs.validate.outputs.compiler-tag }}
        run: |
          set -euo pipefail
          assets=(dist/release/*)

          # gh release create refuses an existing release; refuse an existing tag too.
          tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION" --jq "[.[] | select(.ref == \"refs/tags/$VERSION\")] | length")
          test "$tags" = 0

          gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
            --title "$TITLE" --prerelease="$PRERELEASE" \
            --notes-file dist/notes.md "${assets[@]}"

          mkdir published
          gh release download "$VERSION" --dir published
          for asset in "${assets[@]}"; do
            cmp "$asset" "published/$(basename "$asset")"
          done
          test "$(find published -type f | wc -l)" = "${#assets[@]}"

          # A nightly released during the build invalidates this candidate.
          # Leave the draft unpublished; update the pin and repeat the tests.
          latest=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)
          test "$COMPILER_TAG" = "$latest" || { echo "Compiler $COMPILER_TAG is no longer the latest nightly ($latest); update the pin and rerun the full suite" >&2; exit 1; }

          gh release edit "$VERSION" --draft=false

  # A final release changes which release is the latest, so the site is
  # rebuilt and deployed. A release candidate does not change the site.
  site:
    name: Site
    if: needs.validate.outputs.prerelease != 'true'
    needs: [validate, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  # The required check of the dry run: green only when every job above it
  # succeeded.
  required:
    name: Release dry run
    if: always() && github.event_name == 'pull_request'
    needs: [validate, build, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job succeeded
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
