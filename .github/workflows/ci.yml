name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Every script runs through `nix develop -c`: the flake's dev shell is the one
# definition of the toolchain (see .github/actions/toolchain).
jobs:
  # Cross-builds every release binary once: the CLI and the standalone SBOM
  # tool for each system. The cli, scenarios and builds jobs test the x86_64
  # Linux ones, so the binary that is tested is the binary that ships.
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain

      - run: nix develop -c scripts/test.roc static

      - name: Fetch and verify the platform's linker inputs
        run: nix develop -c scripts/link_inputs.roc fetch

      - name: Cross-build the release binaries, the SBOM tool and the smoke-test programs
        run: nix develop -c scripts/build_release.roc

      # Later jobs evaluate a Blueprint.roc against this checkout's platform;
      # some have no Roc or Zig of their own, so they take the built hosts and
      # the verified linker inputs from here. Uploaded before the smoke test,
      # so the jobs that wait for the artifact start without waiting for it.
      - name: Upload the binaries, platform hosts and linker inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueprint-binaries
          path: |
            dist/blueprint-*
            dist/smoke-*
            blueprint-platform/targets/*/*.a
            blueprint-platform/targets/*/crt1.o
            blueprint-platform/targets/*/*.lib
          if-no-files-found: error

      # Outside the dev shell: the binary must work with no Roc on PATH. A
      # failure here still fails this job, and so the required `test` check.
      - name: Smoke test the Linux binary
        run: dist/smoke-x86_64-linux dist/blueprint-x86_64-linux

  # Groups of scripts/test.roc that need no CLI binary start at once.
  checks:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [unit, package, glue, fuzz]
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain

      - run: nix develop -c scripts/test.roc ${{ matrix.group }}

      - name: Upload fuzz crash inputs
        if: failure() && matrix.group == 'fuzz'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  # Groups that drive the CLI use the binary the build job produced. The
  # real-Nix suites are two groups, scenarios and builds, of about the same
  # length: these jobs are the longest after build, so they run side by side.
  cli:
    permissions:
      contents: read
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [cli, scenarios, builds]
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blueprint-binaries

      - name: Use the built binary
        run: install -m 755 dist/blueprint-x86_64-linux blueprint

      # The artifact also holds the platform hosts the build job built from
      # this commit; with BLUEPRINT_PREBUILT they are used, not rebuilt.
      - run: nix develop -c scripts/test.roc ${{ matrix.group }}
        env:
          BLUEPRINT_PREBUILT: 1

      # The unit job builds the SBOM tool from source with roc-stable; this
      # runs the same binding checks against the cross-built binary that ships.
      - name: Read-only SPDX binding with the cross-built SBOM tool
        if: matrix.group == 'cli'
        run: |
          chmod +x dist/blueprint-sbom-x86_64-linux
          nix develop -c roc-stable scripts/test_sbom.roc binding "$PWD/dist/blueprint-sbom-x86_64-linux" tests/sbom/fixtures/input tests/sbom/fixtures/source-import

  # Compare the same tiny producer on two independent Linux runners. The
  # second compiles a synthetic next-patch CLI; frozen runner pins stay fixed.
  reproducible:
    permissions:
      contents: read
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            system: ubuntu-24.04
          - variant: synthetic
            system: ubuntu-22.04
    name: reproducible-${{ matrix.variant }}
    runs-on: ${{ matrix.system }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blueprint-binaries
      - run: install -m 755 dist/blueprint-x86_64-linux blueprint
      - name: Build and rebuild the selected-input producer
        run: nix develop -c scripts/reproducible_probe.roc run ${{ matrix.variant }} dist/reproducible-${{ matrix.variant }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible-probe-${{ matrix.variant }}
          path: dist/reproducible-${{ matrix.variant }}.json
          if-no-files-found: error

  reproducible-compare:
    permissions:
      contents: read
    needs: reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reproducible-probe-*
          path: dist/reproducible-probes
          merge-multiple: true
      - name: Compare actual derivations and outputs from both hosts
        run: nix develop -c scripts/reproducible_probe.roc compare dist/reproducible-probes/reproducible-release.json dist/reproducible-probes/reproducible-synthetic.json

  # Two binaries are cross-built for machines the Linux job cannot run, so
  # run each where it must work. These runners have Nix and deliberately no
  # Roc: the smoke test is itself a program the build job cross-built.
  binaries:
    permissions:
      contents: read
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-latest, system: aarch64-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blueprint-binaries

      - name: Smoke test the binary
        run: |
          chmod +x dist/blueprint-${{ matrix.system }} dist/smoke-${{ matrix.system }}
          dist/smoke-${{ matrix.system }} dist/blueprint-${{ matrix.system }}

      # The flake names this system too. Evaluating it elsewhere does not show
      # that the package builds here.
      - name: The flake package builds and runs
        if: matrix.system == 'aarch64-linux'
        run: |
          nix build .#blueprint
          result/bin/blueprint --version

  # A project that takes nothing from Nix, on machines that have none: no step
  # here installs Nix, and the smoke program refuses to start when `nix` is on
  # PATH. The binary installs its embedded compiler, writes the lock, reports
  # that tasks need no provider, and builds and runs a basic-cli script. It must
  # install the compiler once without downloading it. This is the only job that
  # links with the embedded `roc` on macOS, where the compiler
  # needs the `darwin` directory of its archive beside it.
  no-nix:
    permissions:
      contents: read
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-latest, system: aarch64-darwin }
          - { runner: macos-15-intel, system: x86_64-darwin }
          - { runner: windows-latest, system: x86_64-windows }
    name: no-nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The binaries, and the platform hosts the project's Blueprint.roc is
      # evaluated against: this checkout's platform, as built in this run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blueprint-binaries

      - name: Update, fetch, link and run with no Nix on the machine
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/blueprint-${{ matrix.system }} dist/smoke-${{ matrix.system }}
          dist/smoke-${{ matrix.system }} --no-nix dist/blueprint-${{ matrix.system }}

      - name: Update, fetch, link and run on Windows without Nix
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dist/smoke-x86_64-windows.exe --no-nix ./dist/blueprint-x86_64-windows.exe

      # The SBOM tool binary of this system inspects, binds and checks the
      # committed fixtures with no Roc and no Nix.
      - name: Smoke test the SBOM tool binary
        uses: ./.github/actions/sbom-tool
        with:
          binary: dist/blueprint-sbom-${{ matrix.system }}${{ runner.os == 'Windows' && '.exe' || '' }}

  # The one required check: green only when every job above succeeded.
  test:
    permissions: {}
    if: always()
    needs: [build, checks, cli, binaries, no-nix, reproducible, reproducible-compare]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
