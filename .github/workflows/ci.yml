name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a nightly candidate without publishing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Restore the linker-input download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/link-inputs
          key: link-inputs-${{ hashFiles('link-inputs.lock.json') }}

      # Fetches the linker inputs first, verifying them against
      # link-inputs.lock.json whether or not the cache was restored.
      - run: ./scripts/test.sh

      - name: Cross-build the release binaries
        run: scripts/build-release.sh

      - name: Smoke test the Linux binary
        run: scripts/smoke-binary.sh dist/blueprint-x86_64-linux

      # The jobs below evaluate a Blueprint.roc against this checkout's
      # platform without Roc or Zig of their own, so they take the built hosts
      # and the verified linker inputs from here.
      - name: Upload the binaries, platform hosts and linker inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blueprint-binaries
          path: |
            dist/blueprint-*
            blueprint-platform/targets/*/*.a
            blueprint-platform/targets/*/crt1.o
          if-no-files-found: error

      - name: Upload fuzz crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  # Two binaries are cross-built for machines the Linux job cannot run, so
  # run each where it must work.
  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-latest, system: aarch64-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blueprint-binaries

      - name: Smoke test the binary
        env:
          SMOKE_PACKAGES: ${{ matrix.packages }}
        run: |
          chmod +x dist/blueprint-${{ matrix.system }}
          scripts/smoke-binary.sh dist/blueprint-${{ matrix.system }}
