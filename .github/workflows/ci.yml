name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a nightly candidate without publishing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every script runs through `nix develop -c`: the flake's dev shell is the one
# definition of the toolchain (see .github/actions/toolchain).
jobs:
  # Cross-builds every release binary once. The cli, scenarios and builds jobs
  # test the x86_64 Linux one, so the binary that is tested is the binary that
  # ships.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain

      - run: nix develop -c scripts/test.roc static

      - name: Fetch and verify the platform's linker inputs
        run: nix develop -c scripts/link_inputs.roc fetch

      - name: Cross-build the release binaries and their smoke-test programs
        run: nix develop -c scripts/build_release.roc

      # Later jobs evaluate a Blueprint.roc against this checkout's platform;
      # some have no Roc or Zig of their own, so they take the built hosts and
      # the verified linker inputs from here. Uploaded before the smoke test,
      # so the jobs that wait for the artifact start without waiting for it.
      - name: Upload the binaries, platform hosts and linker inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blueprint-binaries
          path: |
            dist/blueprint-*
            dist/smoke-*
            blueprint-platform/targets/*/*.a
            blueprint-platform/targets/*/crt1.o
          if-no-files-found: error

      # Outside the dev shell: the binary must work with no Roc on PATH. A
      # failure here still fails this job, and so the required `test` check.
      - name: Smoke test the Linux binary
        run: dist/smoke-x86_64-linux dist/blueprint-x86_64-linux

  # Groups of scripts/test.roc that need no CLI binary start at once.
  checks:
    strategy:
      fail-fast: false
      matrix:
        group: [unit, package, fuzz]
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain

      - run: nix develop -c scripts/test.roc ${{ matrix.group }}

      - name: Upload fuzz crash inputs
        if: failure() && matrix.group == 'fuzz'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  # Groups that drive the CLI use the binary the build job produced. The
  # real-Nix suites are two groups, scenarios and builds, of about the same
  # length: these jobs are the longest after build, so they run side by side.
  cli:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [cli, scenarios, builds]
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blueprint-binaries

      - name: Use the built binary
        run: install -m 755 dist/blueprint-x86_64-linux blueprint

      # The artifact also holds the platform hosts the build job built from
      # this commit; with BLUEPRINT_PREBUILT they are used, not rebuilt.
      - run: nix develop -c scripts/test.roc ${{ matrix.group }}
        env:
          BLUEPRINT_PREBUILT: 1

  # Two binaries are cross-built for machines the Linux job cannot run, so
  # run each where it must work. These runners have Nix and deliberately no
  # Roc: the smoke test is itself a program the build job cross-built.
  binaries:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-latest, system: aarch64-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blueprint-binaries

      - name: Smoke test the binary
        run: |
          chmod +x dist/blueprint-${{ matrix.system }} dist/smoke-${{ matrix.system }}
          dist/smoke-${{ matrix.system }} dist/blueprint-${{ matrix.system }}

  # The one required check: green only when every job above succeeded.
  test:
    if: always()
    needs: [build, checks, cli, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
