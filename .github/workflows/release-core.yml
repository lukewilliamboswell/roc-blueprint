name: Release roc-blueprint-core

# Push a tag like core-0.1.0 to publish the roc-blueprint-core package bundle.
# The package is released independently of the platform; to use a new core
# release in the platform, put its URL in blueprint-platform/core-release.
on:
  push:
    tags: ["core-[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/toolchain

      - name: Test
        run: |
          nix develop -c roc fmt --check blueprint-core
          nix develop -c roc test blueprint-core/main.roc

      - name: Bundle
        run: nix develop -c scripts/bundle.roc core

      - name: Write the release notes
        id: notes
        run: nix develop -c scripts/release_notes.roc dist/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.notes.outputs.bundle }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --prerelease="$PRERELEASE" --latest=false
          --title "$TITLE" --notes-file dist/notes.md "dist/$BUNDLE"
