name: Update Roc nightly

on:
  schedule:
    # About four hours after the upstream 09:00 UTC build.
    - cron: "10 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: roc-nightly-update
  cancel-in-progress: false

jobs:
  update:
    # Ceiling only: the reusable workflow narrows permissions per job.
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/update-roc-nightly.yml@9ca8bc7f1fe5507f2ea562cb075210d9a5d91bcc
