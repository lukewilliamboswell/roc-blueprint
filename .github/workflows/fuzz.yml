name: Fuzz

# CI replays each fuzz target's committed corpus on every commit, which takes
# seconds. This fuzzes each target for a while, weekly or on request.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        type: number
        default: 300

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        # The directories of blueprint-core/fuzz; scripts/test.roc static
        # fails when the two differ.
        target: [lock-parse, spec-parse, spec-round-trip]
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain

      # What earlier runs found, so this one starts where they stopped. The
      # committed corpus is read as seeds beside it and is never written. A
      # cache entry cannot be replaced, so each run saves under its own key
      # and restores the newest.
      - name: Restore the corpus of earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-v1-${{ matrix.target }}-

      - name: Fuzz the target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || 300 }}
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_CORPUS: .cache/fuzz-corpus
        run: nix develop -c scripts/fuzz.roc "$SECONDS_PER_TARGET" "$FUZZ_TARGET"

      # Also after a crash: the inputs that led there are worth keeping.
      - name: Save the corpus for later runs
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload fuzz crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz-artifacts/
          if-no-files-found: ignore
