name: Blueprint toolchain
description: Nix, the flake's development shell, and the linker-input download cache.

# The flake's default dev shell is the one definition of the toolchain: Roc at
# the pinned nightly, Zig and the programs the scripts start. Jobs run every
# script through `nix develop -c`.
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

    # Storage only: scripts/link_inputs.roc rehashes whatever is restored
    # against link-inputs.lock.json.
    - name: Restore the linker-input download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/link-inputs
        key: link-inputs-${{ hashFiles('link-inputs.lock.json') }}

    # A step of its own, so the log shows what entering the shell costs.
    - name: Realise the development shell
      shell: bash
      run: nix develop -c true
