name: Blueprint toolchain
description: Roc at the pinned nightly, Zig, Nix with a download cache, and the linker-input download cache.

runs:
  using: composite
  steps:
    - name: Read pinned Roc nightly
      shell: bash
      run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

    - name: Install Roc
      uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

    - name: Install Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.16.0

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

    # Keeps Nix store downloads between runs in the GitHub Actions cache.
    - name: Cache Nix downloads
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-flakehub: false

    # Storage only: scripts/link_inputs.roc rehashes whatever is restored
    # against link-inputs.lock.json.
    - name: Restore the linker-input download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/link-inputs
        key: link-inputs-${{ hashFiles('link-inputs.lock.json') }}
